<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>独立协议注册</title><style>body{font:16px system-ui;max-width:620px;margin:3rem auto;background:#f6f8fc}main{background:white;padding:2rem;border-radius:12px}label{display:block;margin:1rem 0}input,select{width:100%;box-sizing:border-box;padding:.7rem}button{padding:.7rem 1.2rem}#status{white-space:pre-wrap}</style><main><h1>独立协议注册（OSS）</h1><p>与原注册任务分离。接码沿用工作台邮箱来源；留空邮箱可从所选来源领取。密码不会仅凭注册结果标为已验证。</p><form id="form"><label>邮箱来源<select name="email_source" id="email_source" data-default="{{ default_email_source|e }}"><option value="outlook">Outlook</option><option value="generic_api">通用 API</option><option value="mailalias">Mailalias</option><option value="imap">IMAP</option><option value="cloudflare_domain">域名邮箱（QQ IMAP）</option><option value="cloudflare">Cloudflare 临时邮箱</option><option value="gptmail">GPTMail</option><option value="mailnest">Mailnest</option><option value="cloudmail">Cloudmail</option><option value="remail">Remail</option><option value="xigua">西瓜</option><option value="mailcode">Mailcode</option><option value="icloud_relay">iCloud HTTPS 中转</option></select></label><label>邮箱（可留空自动领取；中转模式必填）<input name="email" type="email"></label><label>HTTPS 中转取件链接（仅中转模式）<input name="relay_url" type="url"></label><label>代理地址（留空使用当前代理池）<input name="proxy"></label><button id="submit">启动一次注册</button></form><p id="status" role="status"></p><a href="/">返回工作台</a></main><script>document.getElementById('email_source').value=document.getElementById('email_source').dataset.default;const form=document.getElementById('form'), output=document.getElementById('status'), btn=document.getElementById('submit');form.addEventListener('submit',async ev=>{ev.preventDefault();btn.disabled=true;output.textContent='提交中…';try{const body=Object.fromEntries(new FormData(form));const r=await fetch('/api/oss-protocol/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'提交失败');output.textContent='任务已提交：'+d.job_id;const timer=setInterval(async()=>{try{const response=await fetch('/api/oss-protocol/jobs/'+encodeURIComponent(d.job_id));const j=await response.json();output.textContent='状态：'+j.state+(j.account_id?'；账号 ID：'+j.account_id:'')+(j.error?'；错误：'+j.error:'');if(['success','failed'].includes(j.state)){clearInterval(timer);btn.disabled=false}}catch(e){clearInterval(timer);output.textContent='状态查询失败：'+e.message;btn.disabled=false}},2000)}catch(e){output.textContent=e.message;btn.disabled=false}});</script></html>
